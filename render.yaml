services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service (Node.js Express + Socket.IO)
  # ----------------------------------------------------------------------------
  - type: web
    name: urban-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: govai
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: ENABLE_SLA_JOB
        value: "false"

  # ----------------------------------------------------------------------------
  # Frontend Static Site (Vite + React SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: urban-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: urban-backend
          property: host
